<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Web Edition Clone - Cube Test</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #1f2937, #030712 70%);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      main {
        width: min(960px, 95vw);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1rem, 2vw, 1.3rem);
        font-weight: 600;
      }

      p {
        margin: 0 0 1rem;
        color: #94a3b8;
        font-size: 0.95rem;
      }

      #canvas {
        width: 100%;
        aspect-ratio: 16 / 10;
        max-height: 80vh;
        border: 1px solid #334155;
        border-radius: 8px;
        display: block;
        background: #020617;
        box-shadow: 0 10px 30px rgb(0 0 0 / 45%);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Minecraft Web Edition Clone Prototype</h1>
      <p>WebAssembly + C++ WebGL test scene: rotating 3D cube.</p>
      <canvas id="canvas" tabindex="0"></canvas>
    </main>

    <script>
      const canvas = document.getElementById("canvas");
      window.Module = {
        canvas,
        onRuntimeInitialized() {
          console.log("WASM runtime initialized");
        },
      };
    </script>
    <script src="dist/mcwe.js"></script>
  </body>
</html>
